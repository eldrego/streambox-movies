name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t lint test build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build movies Docker image
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL }}
          VITE_APP_ACCESS_TOKEN: ${{ secrets.VITE_APP_ACCESS_TOKEN }}
          VITE_APP_IMAGE_URL_ORIGINAL: ${{ secrets.VITE_APP_IMAGE_URL_ORIGINAL }}
          VITE_APP_IMAGE_URL_WIDTH50: ${{ secrets.VITE_APP_IMAGE_URL_WIDTH50 }}
          VITE_NEW_RELIC_ACCOUNT_ID: ${{ secrets.VITE_NEW_RELIC_ACCOUNT_ID }}
          VITE_NEW_RELIC_TRUST_KEY: ${{ secrets.VITE_NEW_RELIC_TRUST_KEY }}
          VITE_NEW_RELIC_AGENT_ID: ${{ secrets.VITE_NEW_RELIC_AGENT_ID }}
          VITE_NEW_RELIC_LICENSE_KEY: ${{ secrets.VITE_NEW_RELIC_LICENSE_KEY }}
          VITE_NEW_RELIC_APP_ID: ${{ secrets.VITE_NEW_RELIC_APP_ID }}
        run: |
          docker build \
            --build-arg VITE_TMDB_API_KEY \
            --build-arg VITE_APP_BASE_URL \
            --build-arg VITE_APP_ACCESS_TOKEN \
            --build-arg VITE_APP_IMAGE_URL_ORIGINAL \
            --build-arg VITE_APP_IMAGE_URL_WIDTH50 \
            --build-arg VITE_NEW_RELIC_ACCOUNT_ID \
            --build-arg VITE_NEW_RELIC_TRUST_KEY \
            --build-arg VITE_NEW_RELIC_AGENT_ID \
            --build-arg VITE_NEW_RELIC_LICENSE_KEY \
            --build-arg VITE_NEW_RELIC_APP_ID \
            --tag streambox/movies:ci \
            .

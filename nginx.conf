server {
    listen 4202;
    listen [::]:4202;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health check — used by Docker health checks and load balancers
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # CORS — required for Module Federation.
    # The shell (localhost:4200) fetches remoteEntry.js and its chunks from this origin in the browser.
    # nginx drops server-level add_header in any location that sets its own,
    # so locations serving JS below repeat these two lines.
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Never cache remoteEntry.js — its filename has no content hash, so a cached
    # copy would keep pointing the shell at the previous deploy's chunks
    location = /assets/remoteEntry.js {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # Cache hashed build assets aggressively. Limited to /assets/ because files
    # copied from public/ (e.g. favicon.ico) keep their names across deploys.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }
}
